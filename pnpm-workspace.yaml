# Every external version lives here; package.json files use `catalog:`, a
# named peers catalog or `workspace:`. After an edit, run `vp install` and
# commit pnpm-lock.yaml.
packages:
  - packages/*
  - tests/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  # Pinned exact at the `effect` version: it depends on `effect` with a floor
  # that rises patch-for-patch, and the `effect` override forces that copy.
  # Runs the examples under `tsx` (below), and type-checks them with the `tsc`
  # on PATH, the patched native one.
  "@effect/docgen": 4.1.4
  "@effect/language-service": ^0.87.5
  # `effect-tsgo patch --typescript --oxlint` (the root `prepare`) supports an
  # explicit set of TypeScript and oxlint versions and fails the install on
  # any other: this, `@typescript/native` and `vite-plus` (which pins oxlint)
  # move together. Check the `components` table in
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs before bumping any of them.
  "@effect/tsgo": 0.69.0
  "@enfect/oxlint": 0.10.0
  "@types/node": ^26.6.6
  # Must equal the vitest vite-plus bundles.
  "@vitest/coverage-istanbul": 5.1.0
  # Pinned exact at the `effect` version.
  "@effect/vitest": 4.1.4
  # Exact, and moved together: the provider peers on that exact `alchemy`.
  # Move `catalogs.alchemy-peers` with them.
  "@alchemy.run/cloudflare": 2.0.0-beta.87
  alchemy: 2.0.0-beta.87
  effect: 4.1.4
  fallow: 3.43.2
  # Only for `@effect/docgen`, which spawns it to run the examples.
  tsx: ^4.23.13
  # TS7 ships no JS API, so `typescript` is the TS6 compiler (bin `tsc6`) for
  # JS-API consumers, and `@typescript/native` is TS7 (bin `tsc`), the type
  # gate. Exact: its gitHead must match @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` exactly; `vite` is its core
  # under an alias, and `vitest` must equal its pin.
  vite-plus: 1.6.0
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0
  # For tests/workerd. Pinned at the version `@alchemy.run/cloudflare` brings,
  # so the tree holds one copy.
  workerd: 1.20261118.1

# Peer ranges the published packages declare (`catalog:peers`). The `effect`
# floor is `^4.0.0` unless a package's own dependency requires more, in a
# catalog of its own that names it.
catalogs:
  peers:
    effect: ^4.0.0
  # effect-connect-alchemy-cloudflare: its types are the Cloudflare provider's,
  # which (with `alchemy`) peers on `effect ^4.1.0`.
  alchemy-peers:
    "@alchemy.run/cloudflare": 2.0.0-beta.87
    alchemy: 2.0.0-beta.87
    effect: ^4.1.0

overrides:
  # Two copies of `effect` break Context / Layer / Schema identity.
  effect: "catalog:"
  # Dev-only security floors whose parents' declared ranges still admit the
  # vulnerable version. Remove each once its parent requires the fix.
  "launch-editor>shell-quote": ^1.11.0 # GHSA-pqg4-j6r4-53mv
  "@changesets/cli>launch-editor": ^2.14.2 # GHSA-587h-7wmj-h5pm
  "@ts-morph/common>minimatch": ^11.0.1 # GHSA-g3hv-75wg-m249
  vite@*: "catalog:"
  vitest@*: "catalog:"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
  # The binary is the `@cloudflare/workerd-<platform>` optional dependency;
  # the install script only re-downloads it when that is missing.
  workerd: false
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    # docgen's `tsconfck` never calls the API that needs this optional peer.
    "tsconfck>typescript": "6"

# Hold new versions for 8 hours (minutes). Dependabot's 1-day cooldown is
# longer. Keep the toolchain out of the exclusions `vp migrate` adds.
minimumReleaseAge: 480
