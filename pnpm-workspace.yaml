# Every external version lives here; package.json files use `catalog:`, a
# named peers catalog or `workspace:`. After an edit, run `vp install` and
# commit pnpm-lock.yaml.
packages:
  - packages/*
  - tests/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  # Pinned exact at the `effect` version: it depends on `effect` with a floor
  # that rises patch-for-patch, and the `effect` override forces that copy.
  # Runs the examples under `vpx` (scripts/bin/tsx), and type-checks them with the `tsc`
  # on PATH, the patched native one.
  "@effect/docgen": 4.1.5
  "@effect/language-service": ^0.87.5
  # `effect-tsgo patch --typescript --oxlint --tsrs` (the root `prepare`)
  # supports an explicit set of TypeScript, oxlint and tsrs versions and fails
  # the install on any other: this, `@typescript/native` and `vite-plus` (which
  # pins oxlint and tsrs) move together. Check the `components` table in
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs before bumping any of them.
  "@effect/tsgo": 0.73.4
  "@enfect/oxlint": 0.10.0
  "@types/node": ^26.6.11
  # Must equal the vitest vite-plus depends on.
  "@vitest/coverage-istanbul": 5.1.1
  # Pinned exact at the `effect` version.
  "@effect/vitest": 4.1.5
  # Exact, and moved together: the provider peers on that exact `alchemy`.
  # Move `catalogs.alchemy-peers` with them.
  "@alchemy.run/cloudflare": 2.0.0-beta.87
  alchemy: 2.0.0-beta.87
  effect: 4.1.5
  fallow: 3.48.0
  # TS7 ships no JS API, so `typescript` is the TS6 compiler (bin `tsc6`) for
  # JS-API consumers, and `@typescript/native` is TS7 (bin `tsc`), the type
  # gate. Exact: its gitHead must match @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # effect-connect-mjml's compiler. mjml-browser requires cheerio without
  # declaring it.
  "@types/mjml-browser": ^5.0.0
  cheerio: ^1.2.0
  mjml-browser: ^5.4.1
  # effect-connect-react-email's renderer and its React.
  "@react-email/render": ^2.3.1
  "@types/react": ^19.3.3
  react: ^19.3.1
  react-dom: ^19.3.1
  # `vite` (vite-plus's core under an alias) and `vitest` must equal what
  # vite-plus itself depends on (`npm view vite-plus@<v> dependencies`);
  # `vite` no longer equals vite-plus.
  vite-plus: 1.8.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vitest: 5.1.1
  # For tests/workerd. Pinned at the version `@alchemy.run/cloudflare` brings,
  # so the tree holds one copy.
  workerd: 1.20261125.1

# Peer ranges the published packages declare (`catalog:peers`). The `effect`
# floor is `^4.0.0` unless a package's own dependency requires more, in a
# catalog of its own that names it.
catalogs:
  peers:
    effect: ^4.0.0
  # effect-connect-react-email: React Email's renderer and the React it peers on.
  react-email-peers:
    "@react-email/render": ^2.0.0
    react: ^18.0.0 || ^19.0.0
    react-dom: ^18.0.0 || ^19.0.0
  # effect-connect-alchemy-cloudflare: its types are the Cloudflare provider's,
  # which (with `alchemy`) peers on `effect ^4.1.0`.
  alchemy-peers:
    "@alchemy.run/cloudflare": 2.0.0-beta.87
    alchemy: 2.0.0-beta.87
    effect: ^4.1.0

overrides:
  # Two copies of `effect` break Context / Layer / Schema identity.
  effect: "catalog:"
  # Dev-only security floor whose parent's declared range still admits the
  # vulnerable version. Remove it once its parent requires the fix.
  "@ts-morph/common>minimatch": ^11.0.1 # GHSA-g3hv-75wg-m249
  vite@*: "catalog:"
  vitest@*: "catalog:"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
  # The binary is the `@cloudflare/workerd-<platform>` optional dependency;
  # the install script only re-downloads it when that is missing.
  workerd: false
# Agent skills dependencies ship (pnpm 12.11+). `fallow` ships `fallow` and
# `fallow-setup`; only `fallow` is linked, since the repository is already set
# up. Build grants stay in `allowBuilds`: a `permissions` entry without `build`
# leaves its package's `allowBuilds` grant in force.
permissions:
  fallow:
    skills: [fallow]
skills:
  dirs: [.claude/skills]
peerDependencyRules:
  allowedVersions:
    # docgen's `tsconfck` never calls the API that needs this optional peer.
    "tsconfck>typescript": "6"

# Hold new versions for 24 hours (minutes), matching Dependabot's 1-day
# cooldown. Keep the toolchain out of the exclusions `vp migrate` adds.
minimumReleaseAge: 1440
# Vite+ selects Node.js (.node-version) and pnpm (packageManager); pnpm
# must not download or switch to its own.
runtimeOnFail: ignore
pmOnFail: ignore
# docgen runs its examples with `tsx`, which scripts/bin/tsx stands in for
# (through vpx), so its `tsx` peer is optional and never installed.
packageExtensions:
  "@effect/docgen":
    peerDependenciesMeta:
      tsx:
        optional: true
