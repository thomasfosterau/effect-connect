name: CI

# ONE workflow, ONE command: `vp run ci`, the root task in vite.config.ts that
# runs every gate in order (format + lint, type gates, unit and workerd
# tests, builds, audit). It runs once per Node.js version in the matrix.
# There is no aggregate job: a ruleset requires each matrix leg by name,
# `ci (node lts)` and `ci (node latest)`.

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default; each job grants only what it needs. No job uses a
# secret, so a Dependabot or fork pull request runs it safely.
permissions: {}

jobs:
  ci:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The current LTS line and the newest Current release. Both must
        # satisfy the root `engines.node`.
        node: [lts, latest]
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite+, Node.js at the matrix version and the pnpm that package.json's
      # `packageManager` pins, with the pnpm store cache.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
          run-install: false
      # The install is RETRIED, deliberately: pnpm's linker has an upstream
      # race on a cold store that cannot be reproduced on demand. Retrying is
      # safe because the install is idempotent against the committed lockfile;
      # a deterministic failure (lockfile drift) fails all three attempts.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if vp install --frozen-lockfile; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::vp install failed after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 15))
            echo "::warning::vp install failed (attempt ${attempt}/3); retrying in ${delay}s"
            sleep "$delay"
          done
      - name: Toolchain versions
        run: node --version && pnpm --version && vp --version
      - name: CI
        run: vp run ci
