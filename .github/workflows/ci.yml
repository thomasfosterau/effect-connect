name: CI

# ONE job, ONE required check: the pipeline's task graph lives in
# vite.config.ts (the root `check` task), not in GitHub Actions `needs:`.
# Copied in shape from the effect-drizzle-ext library.

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the single job grants only read access.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-
      - name: Toolchain versions
        run: node --version && pnpm --version && vp --version
      - name: Format and lint
        run: vp check
      # Includes every package's docgen: each JSDoc `@example` is type-checked
      # and executed.
      - name: Type gates (packages + emitted declarations + doc examples)
        run: vp run --concurrency-limit 2 check
      - name: Unit tests
        run: vp run -r test:unit
      - name: Build
        run: vp run -r build
      - name: Audit
        run: pnpm audit --audit-level high

  # TEMPORARY (removed before merge): proves the Release workflow's setup on
  # setup-vp, which only runs on a push to trunk.
  release-setup-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22"
          cache: true
          run-install: false
      - run: |
          set -x
          type -a node npm pnpm vp
          node --version; npm --version; pnpm --version; vp --version
          npm config get registry
          npm install -g npm@11.20.0
          hash -r; type -a npm; npm --version
          test "$(npm --version)" = "11.20.0"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          npm view @thomasfosterau/effect-connect@0.1.0 version
          (cd packages/core && pnpm pack --config.ignore-scripts=true --pack-destination "$RUNNER_TEMP" && tar -tzf "$RUNNER_TEMP"/*.tgz | head)
          pnpm exec changeset status || true
