name: CI

# One command, `vp run ci` (vite.config.ts), so a local run is the same pipeline.

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

permissions: {}

jobs:
  ci:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [lts, latest]
    env:
      # Inherited by every child process, each vitest fork included.
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: ${{ matrix.node }}
          cache: true
          run-install: true
      - name: CI
        run: vp run ci
