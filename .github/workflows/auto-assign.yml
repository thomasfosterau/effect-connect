name: Auto-assign

# Assigns every pull request to the owner, so it shows up in their queue.
# `pull_request`, not `pull_request_target`: nothing here needs a secret, and a
# fork's PR (read-only token) is simply left unassigned. Dependabot's PRs are
# assigned by `assignees` in .github/dependabot.yml (its token is read-only).

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# No permissions by default; the single job grants only what the edit needs.
permissions: {}

jobs:
  assign:
    name: assign the owner
    if: github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.assignees.*.login, 'thomasfosterau')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Assign the pull request
        run: gh pr edit "$PR_URL" --add-assignee thomasfosterau
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
