# Composite setup shared by every CI job that needs the toolchain.
# voidzero-dev/setup-vp installs the Vite+ CLI (at the `vite-plus` version in
# the lockfile), Node.js and the pnpm that package.json's `packageManager`
# pins, puts `vp` on PATH and restores the pnpm store cache (keyed on
# pnpm-lock.yaml). Dependencies are then installed with a frozen lockfile
# (retried — see the Install step's own comment for why), so later steps call
# `vp …` directly.
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first).
name: Setup toolchain
description: Set up Vite+, Node.js and pnpm, restore the package cache, and install dependencies.
runs:
  using: composite
  steps:
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1.22.0
      with:
        # The newest Node.js release: CI runs ahead of the `engines` floor.
        node-version: latest
        cache: true
        # The install is its own step below, because it is retried.
        run-install: false

    # The install is RETRIED, deliberately — do not collapse this back to a bare
    # `vp install`. pnpm's linker has an upstream race (a package that
    # resolves into the tree twice and builds can lose its atomic import when
    # the store is cold — observed on the gardeneria application's trunk,
    # 2026-07-26) that cannot be reproduced on demand, so CI is the only place
    # it is ever observed. Retrying is safe because `pnpm install` is
    # idempotent: it reconciles node_modules against the committed lockfile on
    # every attempt. What this deliberately does NOT do, because each trades a
    # flaky install for an unverified dependency tree: skip `--frozen-lockfile`
    # or bypass the supply-chain policy. A genuinely deterministic failure
    # (lockfile drift) simply fails all three attempts and still turns the job
    # red — it costs seconds, since those checks fail fast.
    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if vp install --frozen-lockfile; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::vp install failed after 3 attempts"
            exit 1
          fi
          delay=$((attempt * 15))
          echo "::warning::vp install failed (attempt ${attempt}/3); retrying in ${delay}s"
          sleep "$delay"
        done
